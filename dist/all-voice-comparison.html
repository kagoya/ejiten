<p>12場面・137項目（単語と短い文）の比較です。Aは絵辞典で使用中の元音声、Bは漢字・カタカナを使った読み上げ用表記で生成したVOICEVOXです。各項目にBの入力表記を掲載しています。</p>
<p>A：Microsoft Edge音声合成（Nanami）、速度 −15％。<br>B：VOICEVOX:四国めたん（ノーマル）、速度係数0.85、自動推定アクセント。<br>アクセントは未校正です。速度係数はサービス間で等価ではありません。絵辞典本編の音声は変更していません。</p>

const scenes=[...new Map(records.map(r=>[r.sceneId,r.scene])).entries()];
const select=document.getElementById('scene'),search=document.getElementById('search'),items=document.getElementById('items'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
for(const [id,name] of [['all','すべての場面'],...scenes]){const o=document.createElement('option');o.value=id;o.textContent=name;select.append(o)}
select.value=scenes[0][0];
function node(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function render(){
 for(const a of items.querySelectorAll('audio'))a.pause();
 items.replaceChildren();
 const term=search.value.trim();
 const filtered=records.filter(r=>(select.value==='all'||r.sceneId===select.value)&&(!term||[r.label,r.text,r.scene].some(t=>t.includes(term))));
 count.textContent=filtered.length+'項目を表示 ／ 全'+records.length+'項目';
 for(const r of filtered){
  const section=node('section');section.id=r.id;section.append(node('h2',r.label),node('p',r.scene+' ／ Bの入力：'+r.text,'small'));
  const pair=node('div',null,'pair');
  for(const [name,src] of [['A：元の日本語音声',r.original],['B：VOICEVOX（通常表記）',r.voicevox]]){
   const col=node('div');col.append(node('h3',name));const a=node('audio');a.controls=true;a.preload='metadata';a.src=src;a.setAttribute('aria-label',r.label+' '+name);
   a.addEventListener('play',()=>{for(const other of items.querySelectorAll('audio'))if(other!==a)other.pause()});col.append(a);pair.append(col);
  }
  section.append(pair);items.append(section);
 }
 const idx=scenes.findIndex(s=>s[0]===select.value);prev.disabled=idx<=0;next.disabled=idx<0||idx>=scenes.length-1;
}
select.addEventListener('change',render);search.addEventListener('input',render);
prev.addEventListener('click',()=>{const idx=scenes.findIndex(s=>s[0]===select.value);select.value=scenes[idx-1][0];render()});
next.addEventListener('click',()=>{const idx=scenes.findIndex(s=>s[0]===select.value);select.value=scenes[idx+1][0];render()});
render();
